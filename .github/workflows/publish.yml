# Publish for hollis-shared — the gate that was missing.
#
# Before this workflow, every @hollis-studio/* release was `npm publish` from a
# laptop: no green-CI requirement, no tag/version agreement, no check that the
# packed tarball actually contains the legal text the source declares, and no
# check that what the registry then served matched what was built. contracts
# 0.2.0-alpha.88 and .89 were both published that way. It is also how the
# dist-tags drifted: `latest` sat on 0.2.0-alpha.54 for months, and is still
# behind (0.2.0-alpha.87 against an `alpha` of 0.2.0-alpha.89).
#
# Triggers:
#   * push of a `<package>-v<version>` tag (e.g. contracts-v0.2.0-alpha.90)
#     — runs the full gate and then publishes for real. Every package has a
#     pattern; the tag's version must equal the workspace manifest's version.
#   * workflow_dispatch — same gate, but `dry_run` defaults to true, so a
#     manual run is a rehearsal unless someone explicitly sets it to false.
#
# ---------------------------------------------------------------------------
# THE DIST-TAG RULE (deliberate, and the reason this workflow writes `latest`)
# ---------------------------------------------------------------------------
# Every release here is an `-alpha.N` prerelease, and every consumer in the
# suite pins an EXACT version — `"@hollis-studio/contracts": "0.2.0-alpha.89"`,
# never a range. So no consumer install is steered by a dist-tag at all, and
# the usual "never move latest, prereleases are opt-in" convention buys nothing
# here. What it costs is real:
#
#   * `npm view @hollis-studio/utils versions` prints NOTHING for a package
#     with no `latest`, because the bare spec resolves through `latest` first.
#     Three of the four packages are in that state, and every registry check
#     against them has been misread as an auth failure at least once.
#   * a bare `npm install @hollis-studio/contracts` resolves `latest` and
#     installs months-old legal-document text and the pre-rename studio
#     address, silently.
#
# Therefore, for these packages, BOTH tags move to the version just published:
#
#   alpha  -> the version just published   (written by `npm publish --tag alpha`)
#   latest -> the same version             (written by `npm dist-tag add`)
#
# `latest` is not a stability signal for @hollis-studio/*; it means "the newest
# thing this repo shipped". Stability is expressed by consumers pinning exact
# versions, which they all do. If a non-prerelease 1.0.0 line is ever started,
# revisit this rule before publishing it — a 1.x release would need `latest` to
# stop tracking the alpha channel.
#
# Both moves are asserted after the fact, so a publish that half-lands is a red
# run rather than a silently inconsistent registry.
#
# ---------------------------------------------------------------------------
# POST-PUBLISH VERIFICATION
# ---------------------------------------------------------------------------
# The legal-document hash guard runs twice: once on the locally packed tarball
# (before publish, so a bad build never ships) and once on the tarball
# DOWNLOADED BACK from the registry (after publish). The second run is not
# redundant — contracts alpha.57 through .62 all published tarballs whose legal
# documents regressed relative to the local build, and only a check that reads
# the registry's bytes can catch that class.

name: Publish

on:
  push:
    tags:
      - "contracts-v*"
      - "design-tokens-v*"
      - "utils-v*"
      - "auth-client-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - contracts
          - design-tokens
          - utils
          - auth-client
      dry_run:
        description: Rehearse only (npm publish --dry-run). Uncheck to publish for real.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  # GitHub Packages publication needs write here; CI's read-scoped token cannot
  # publish, which is deliberate — only this workflow gets the write scope.
  packages: write

env:
  NODE_VERSION: 22
  REGISTRY: https://npm.pkg.github.com

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Gate, verify and publish
    # GitHub-hosted rather than the Blacksmith runner CI uses: this is the only
    # job in the repo that holds a package-write credential.
    runs-on: ubuntu-latest
    # Empty until someone adds protection rules; add a required reviewer here to
    # make every real publish need an explicit approval click.
    environment: publish-alpha
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.REGISTRY }}
          scope: "@hollis-studio"

      # ---------------------------------------------------------------------
      # Resolve the target package and assert the tag agrees with the manifest
      # ---------------------------------------------------------------------
      - name: Resolve target package and version
        id: target
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            dir="$INPUT_PACKAGE"
            tag_version=""
          else
            # Tag shape: <package-dir>-v<version>, e.g. contracts-v0.2.0-alpha.88
            dir="${TAG%%-v*}"
            tag_version="${TAG#*-v}"
            if [ "$dir" = "$TAG" ] || [ -z "$tag_version" ]; then
              echo "::error::Tag '$TAG' is not <package>-v<version>"
              exit 1
            fi
          fi

          manifest="packages/$dir/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::No such package directory: packages/$dir"
            exit 1
          fi
          name="$(node -p "require('./$manifest').name")"
          version="$(node -p "require('./$manifest').version")"

          if [ -n "$tag_version" ] && [ "$tag_version" != "$version" ]; then
            echo "::error::Tag '$TAG' says version $tag_version but $manifest says $version"
            exit 1
          fi

          # Only prereleases belong on the alpha tag. A plain 1.2.3 version
          # would be a release and needs a deliberate, different process.
          case "$version" in
            *-alpha.*) ;;
            *)
              echo "::error::$name@$version is not an -alpha prerelease; this workflow only publishes the alpha dist-tag"
              exit 1
              ;;
          esac

          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $name@$version (packages/$dir)"

      - name: Resolve dry-run mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Default to a rehearsal for manual runs; a pushed tag is an explicit
          # release instruction and publishes for real.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # The same gate ci.yml runs — publishing never bypasses it
      # ---------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, typecheck, smoke-import
        run: npm run check

      - name: Package authentication helper tests
        run: npm run test:package-auth

      - name: Contracts tests
        run: npm --workspace @hollis-studio/contracts run test

      # ---------------------------------------------------------------------
      # Verify the artefact, not the working tree
      # ---------------------------------------------------------------------
      - name: Pack tarballs
        id: pack
        env:
          NAME: ${{ steps.target.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p .publish-pack
          # Contracts is always packed: its tarball carries the six signed legal
          # documents, and that is what the next step verifies.
          npm pack --workspace @hollis-studio/contracts --pack-destination .publish-pack
          contracts_tarball="$(ls .publish-pack/hollis-studio-contracts-*.tgz)"
          if [ "$NAME" = "@hollis-studio/contracts" ]; then
            target_tarball="$contracts_tarball"
          else
            npm pack --workspace "$NAME" --pack-destination .publish-pack
            target_tarball="$(ls .publish-pack/*.tgz | grep -v hollis-studio-contracts- | head -1)"
          fi
          echo "contracts_tarball=$contracts_tarball" >> "$GITHUB_OUTPUT"
          echo "target_tarball=$target_tarball" >> "$GITHUB_OUTPUT"
          echo "Packed target: $target_tarball"

      - name: Verify legal document hashes in the packed contracts tarball
        env:
          TARBALL: ${{ steps.pack.outputs.contracts_tarball }}
        # npm pack ships whatever is already in dist and does NOT run
        # prepublishOnly, so this reads the six documents out of the tarball and
        # compares each version + contentHash against the source modules.
        run: node scripts/verify-packed-legal-docs.mjs "$TARBALL"

      - name: Record dist-tags before publishing
        id: before
        env:
          NAME: ${{ steps.target.outputs.name }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `npm view <pkg> dist-tags` prints nothing for a package with no
          # `latest`, so the spec has to name a tag that exists.
          alpha="$(npm view "$NAME@alpha" dist-tags.alpha --registry="$REGISTRY" 2>/dev/null || true)"
          latest="$(npm view "$NAME@alpha" dist-tags.latest --registry="$REGISTRY" 2>/dev/null || true)"
          {
            echo "alpha=$alpha"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "before publish: alpha='${alpha:-<none>}' latest='${latest:-<none>}'"

      - name: Dist-tag health report (before)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Informational baseline. Several packages have stale or missing tags
        # that this run is not responsible for, so it must not block.
        continue-on-error: true
        run: node scripts/dist-tag-health.mjs

      # ---------------------------------------------------------------------
      # Publish — alpha dist-tag only, from the verified tarball
      # ---------------------------------------------------------------------
      - name: Publish (dry run)
        if: steps.mode.outputs.dry_run == 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.target_tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$TARBALL" --tag alpha --registry="$REGISTRY" --dry-run

      - name: Publish
        if: steps.mode.outputs.dry_run == 'false'
        env:
          TARBALL: ${{ steps.pack.outputs.target_tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publishing the tarball (not the workspace) guarantees the published
        # bytes are the bytes the legal-document verification just read.
        # `--tag alpha` writes the alpha channel; `latest` is moved deliberately
        # two steps below. See THE DIST-TAG RULE at the top of this file.
        run: npm publish "$TARBALL" --tag alpha --registry="$REGISTRY"

      # ---------------------------------------------------------------------
      # Verify what the REGISTRY now serves, not what we built
      # ---------------------------------------------------------------------
      - name: Verify legal document hashes in the PUBLISHED tarball
        if: steps.mode.outputs.dry_run == 'false'
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Downloads the tarball back out of GitHub Packages and re-runs the same
        # source-vs-tarball comparison against the bytes a consumer would
        # actually install. contracts alpha.57-.62 published tarballs whose
        # legal documents disagreed with the local build; a pre-publish check
        # alone cannot see that.
        #
        # For a contracts release this reads the version just pushed. For any
        # other package there is no new contracts tarball, so it re-checks
        # whatever contracts version the `alpha` tag currently serves — but only
        # when that equals the workspace's contracts version, since source being
        # legitimately ahead of the registry is not a failure.
        run: |
          set -euo pipefail
          workspace_contracts="$(node -p "require('./packages/contracts/package.json').version")"

          if [ "$NAME" = "@hollis-studio/contracts" ]; then
            spec="@hollis-studio/contracts@$VERSION"
          else
            published="$(npm view "@hollis-studio/contracts@alpha" version --registry="$REGISTRY" 2>/dev/null || true)"
            if [ "$published" != "$workspace_contracts" ]; then
              echo "::notice::Skipping published-contracts check: registry alpha is '${published:-<none>}', workspace source is $workspace_contracts. Source is ahead of the registry, so there is nothing comparable to verify."
              exit 0
            fi
            spec="@hollis-studio/contracts@$published"
          fi

          rm -rf .published-pack && mkdir -p .published-pack
          # GitHub Packages can take a few seconds to serve a just-published
          # version; retry rather than failing a good publish on propagation.
          for attempt in 1 2 3 4 5; do
            if npm pack "$spec" --pack-destination .published-pack --registry="$REGISTRY" --ignore-scripts; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not download $spec from $REGISTRY after 5 attempts"
              exit 1
            fi
            echo "download attempt $attempt failed; retrying in 10s"
            sleep 10
          done

          downloaded="$(ls .published-pack/*.tgz | head -1)"
          echo "Verifying published tarball: $spec -> $downloaded"
          node scripts/verify-packed-legal-docs.mjs "$downloaded"

      # ---------------------------------------------------------------------
      # Dist-tags: alpha AND latest, both deliberate
      # ---------------------------------------------------------------------
      - name: Move latest to the published version
        if: steps.mode.outputs.dry_run == 'false'
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `npm publish --tag alpha` already set `alpha`. `latest` has to be set
        # explicitly, because npm only writes `latest` when you publish WITHOUT
        # a --tag. Consumers all pin exact versions, so `latest` here is a
        # discoverability tag, not a stability promise — a package with no
        # `latest` cannot even be inspected with a bare `npm view`.
        run: npm dist-tag add "$NAME@$VERSION" latest --registry="$REGISTRY"

      - name: Assert both dist-tags point at the published version
        if: steps.mode.outputs.dry_run == 'false'
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          BEFORE_ALPHA: ${{ steps.before.outputs.alpha }}
          BEFORE_LATEST: ${{ steps.before.outputs.latest }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          alpha="$(npm view "$NAME@alpha" dist-tags.alpha --registry="$REGISTRY" 2>/dev/null || true)"
          latest="$(npm view "$NAME@alpha" dist-tags.latest --registry="$REGISTRY" 2>/dev/null || true)"
          echo "alpha  -> '${alpha:-<none>}' (was '${BEFORE_ALPHA:-<none>}')"
          echo "latest -> '${latest:-<none>}' (was '${BEFORE_LATEST:-<none>}')"
          failed=0
          if [ "$alpha" != "$VERSION" ]; then
            echo "::error::'alpha' points at '${alpha:-<none>}', expected $VERSION"
            failed=1
          fi
          if [ "$latest" != "$VERSION" ]; then
            echo "::error::'latest' points at '${latest:-<none>}', expected $VERSION — the registry is now inconsistent; fix with: npm dist-tag add $NAME@$VERSION latest"
            failed=1
          fi
          [ "$failed" = "0" ]

      - name: Dist-tag health report (after)
        if: steps.mode.outputs.dry_run == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Informational: flags any OTHER package whose tags are still stale.
        # Those are separate, separately authorized `npm dist-tag add` calls.
        continue-on-error: true
        run: node scripts/dist-tag-health.mjs

      - name: Summary
        if: always()
        env:
          NAME: ${{ steps.target.outputs.name }}
          VERSION: ${{ steps.target.outputs.version }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          {
            echo "### ${NAME:-unknown}@${VERSION:-unknown}"
            echo ""
            echo "- dry run: \`${DRY_RUN:-unknown}\`"
            echo "- dist-tags written: \`alpha\` and \`latest\`, both -> \`${VERSION:-unknown}\`"
            echo "- legal-document hashes verified in the packed tarball **and** in the tarball downloaded back from the registry"
          } >> "$GITHUB_STEP_SUMMARY"
